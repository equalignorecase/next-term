[package]
name = "nexterm"
version = "0.1.0"
description = "NexTerm — A modern, secure SSH client for developers"
authors = ["NexTerm Contributors"]
license = "MIT"
repository = ""
edition = "2021"

[lib]
name = "nexterm_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.0.5", features = [], optional = true }

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build"]

[dependencies]
tauri = { version = "2.2.0", features = [], optional = true }
tauri-plugin-dialog = { version = "2.2.0", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.42", features = ["full"] }
russh = "0.49.2"
russh-keys = "0.49.2"
async-trait = "0.1"
sqlx = { version = "0.8.2", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
keyring = { version = "3.6.1", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
zeroize = { version = "1.8", features = ["derive"] }
base64 = "0.22"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5.0"

[dev-dependencies]
tempfile = "3.14"
rand = "0.8"
